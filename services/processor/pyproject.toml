[project]
name = "ayon-autolists-processor"
version = "0.1.0"
description = "Processor service for AYON Auto Lists"
requires-python = "==3.11.*"
dependencies = [
    "ayon-python-api>=1.2.16",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
